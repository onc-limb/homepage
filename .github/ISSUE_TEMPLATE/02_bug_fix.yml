name: "🐛 不具合対応"
description: "バグの修正や不具合の対応に関するリクエスト"
title: "[BUG] "
labels: ["bug", "fix"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## 概要
        発生している不具合について詳細を記載してください。GitHub Copilot Code Agentが問題を正確に理解し修正できるよう、再現手順や期待動作を明確に記述してください。

  - type: textarea
    id: bug_summary
    attributes:
      label: "🔍 不具合の概要"
      description: "発生している不具合を簡潔に説明してください"
      placeholder: "例：記事詳細ページで画像が正しく表示されない"
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: "🚨 重要度"
      description: "不具合の重要度を選択してください"
      options:
        - "Critical - サービス停止、データ損失"
        - "High - 主要機能が使用不可"
        - "Medium - 一部機能に影響"
        - "Low - 軽微な問題、回避可能"
    validations:
      required: true

  - type: textarea
    id: current_behavior
    attributes:
      label: "🔄 現在の動作"
      description: "現在どのような動作をしているかを詳しく説明してください"
      placeholder: |
        例：
        - 記事詳細ページにアクセスすると、画像の代わりに alt テキストのみが表示される
        - ブラウザの開発者ツールで 404 エラーが確認できる
        - 画像パスが正しく解決されていない様子
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: "✅ 期待する動作"
      description: "本来どのような動作をするべきかを説明してください"
      placeholder: |
        例：
        - 記事詳細ページで画像が正しく表示される
        - 画像が存在しない場合は適切なフォールバック表示がされる
        - エラーが発生しない
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: "🔄 再現手順"
      description: "不具合を再現するための詳細な手順を記載してください"
      placeholder: |
        1. ブラウザで http://localhost:3000 にアクセス
        2. 記事一覧ページから任意の記事をクリック
        3. 記事詳細ページが表示される
        4. 画像が表示されないことを確認
      value: |
        1. 
        2. 
        3. 
        4.
    validations:
      required: true

  - type: textarea
    id: error_messages
    attributes:
      label: "⚠️ エラーメッセージ・ログ"
      description: "コンソールエラー、ログ、スクリーンショットなどがあれば記載してください"
      placeholder: |
        ```
        Console Error:
        GET http://localhost:3000/images/article1.jpg 404 (Not Found)

        Network Tab:
        Failed to load resource: the server responded with a status of 404 (Not Found)
        ```

        または画像・スクリーンショットを貼り付けてください

  - type: checkboxes
    id: environment
    attributes:
      label: "🌐 環境情報"
      description: "不具合が発生している環境をチェックしてください"
      options:
        - label: "開発環境 (npm run dev)"
        - label: "本番環境"
        - label: "Chrome"
        - label: "Firefox"
        - label: "Safari"
        - label: "Edge"
        - label: "Mobile (iOS)"
        - label: "Mobile (Android)"

  - type: textarea
    id: investigation_findings
    attributes:
      label: "🔍 調査結果・原因分析"
      description: "すでに調査した内容や原因の推測があれば記載してください"
      placeholder: |
        ## 調査内容
        - [ ] ファイルパスの確認
        - [ ] Next.jsの画像最適化設定の確認
        - [ ] public フォルダの構成確認

        ## 原因の推測
        - 画像パスの解決方法に問題がある可能性
        - Next.js Image コンポーネントの設定不備の可能性

  - type: textarea
    id: fix_tasks
    attributes:
      label: "🔧 修正タスク"
      description: "修正に必要な具体的なタスクを詳細に列挙してください"
      placeholder: |
        ## 調査タスク
        - [ ] `app/articles/[title]/page.tsx` の画像表示ロジック確認
        - [ ] `public/` フォルダの画像ファイル存在確認
        - [ ] Next.js Image コンポーネントの設定確認

        ## 修正タスク
        - [ ] 画像パスの修正
        - [ ] Next.js Image コンポーネントの適切な実装
        - [ ] エラーハンドリングの追加
        - [ ] フォールバック表示の実装

        ## テストタスク
        - [ ] 修正後の動作確認
        - [ ] 他のページへの影響確認
        - [ ] 異なるブラウザでの動作確認
    validations:
      required: true

  - type: checkboxes
    id: fix_requirements
    attributes:
      label: "🛠️ 修正要件"
      description: "修正時に考慮すべき要件をチェックしてください"
      options:
        - label: "既存機能への影響を最小限にする"
          required: true
        - label: "TypeScriptの型安全性を維持する"
          required: true
        - label: "ESLintルールに準拠する"
          required: true
        - label: "パフォーマンスへの影響を考慮する"
          required: false
        - label: "後方互換性を維持する"
          required: false
        - label: "テストケースを追加する"
          required: false

  - type: textarea
    id: related_files
    attributes:
      label: "📂 関連ファイル"
      description: "修正が必要と思われるファイルや調査対象ファイルを列挙してください"
      placeholder: |
        - `app/articles/[title]/page.tsx` - 記事詳細ページ
        - `lib/article.ts` - 記事取得ロジック
        - `next.config.mjs` - Next.js設定
        - `public/` - 画像ファイル

  - type: textarea
    id: additional_context
    attributes:
      label: "💡 追加情報"
      description: "その他、修正時に考慮すべき点や制約事項があれば記載してください"
      placeholder: "例：この不具合は特定の条件下でのみ発生する、他の機能との依存関係があるなど"
